name: Elpriset CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Check code with Ruff
        run: python -m ruff check application tests scripts

      - name: Run tests
        run: python -m pytest -v --junitxml=test-results.xml

      - name: Save test report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: test-results
          path: test-results.xml
          if-no-files-found: warn
  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Build Docker image
        run: |
          docker build \
            --build-arg APP_VERSION=${{ github.sha }} \
            -t elpriset:${{ github.sha }} .

      - name: Save Docker image to file
        run: docker save --output elpriset-image.tar elpriset:${{ github.sha }}

      - name: Upload Docker image
        uses: actions/upload-artifact@v7.0.2
        with:
          name: elpriset-image
          path: elpriset-image.tar
          if-no-files-found: error
  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Download Docker image
        uses: actions/download-artifact@v8.0.2
        with:
          name: elpriset-image

      - name: Load Docker image
        run: docker load --input elpriset-image.tar

      - name: Start application
        run: |
          docker run -d \
            --name elpriset-ci \
            -p 127.0.0.1:8000:8000 \
            elpriset:${{ github.sha }}

      - name: Check application health
        run: |
          curl --fail --silent --show-error \
            --retry 10 --retry-all-errors --retry-delay 1 \
            --retry-max-time 30 --max-time 5 \
            http://127.0.0.1:8000/health

      - name: Verify running version
        run: python3 scripts/verify_version.py "${{ github.sha }}"
        
      - name: Show container logs
        if: always()
        run: docker logs elpriset-ci

      - name: Stop and remove container
        if: always()
        run: docker rm --force elpriset-ci
